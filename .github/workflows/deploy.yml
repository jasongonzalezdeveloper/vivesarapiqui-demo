name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela uno que ya está publicando.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Da la ruta base: "/vivesarapiqui-demo" en github.io o "" con dominio propio.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run lint

      - name: Build (exportación estática)
        run: npm run build
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Opcionales: sin clave el sitio usa el mapa ilustrado.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}

      - run: touch out/.nojekyll

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
